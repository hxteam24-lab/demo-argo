apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard
  namespace: argocd
  annotations:
    # Image Updater: auto-detect new tags for adguard/adguardhome
    argocd-image-updater.argoproj.io/image-list: adguard=adguard/adguardhome
    argocd-image-updater.argoproj.io/adguard.update-strategy: semver
    argocd-image-updater.argoproj.io/adguard.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/adguard.helm.image-tag: image.tag
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-credentials: secret:argocd/git-creds
spec:
  project: default
  source:
    # Internal GitLab CE in the cluster (gitlab namespace)
    repoURL: http://gitlab.gitlab.svc.cluster.local/root/demo-gitops.git
    targetRevision: main
    path: charts/adguard
    helm:
      valueFiles:
        - ../../values/adguard-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: adguard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
