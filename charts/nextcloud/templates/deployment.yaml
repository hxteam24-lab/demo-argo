apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: nextcloud
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    until [ -f /var/www/html/config/config.php ]; do sleep 2; done
                    su -s /bin/sh www-data -c "php /var/www/html/occ config:system:set trusted_domains 1 --value='{{ .Values.ingress.trustedDomain }}'" || true
                    su -s /bin/sh www-data -c "php /var/www/html/occ config:system:set overwritewebroot --value='/cloud'" || true
                    su -s /bin/sh www-data -c "php /var/www/html/occ config:system:set overwrite.cli.url --value='http://{{ .Values.ingress.trustedDomain }}:30080/cloud'" || true
          volumeMounts:
            - name: data
              mountPath: /var/www/html
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
